name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Lint, Typecheck, Test
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df5e7f1f990e5f64d0a5824da42 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a54e280ec667c276c9caf527 # v4.0.4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm lint && pnpm typecheck && pnpm test

      - name: Verify NCE Contract Drift
        run: pnpm vitest run bff/src/nce-client/schema.test.ts

      - name: Verify Suite-Wide Entity & Engine Coverage (OB.W7 / B145)
        run: pnpm vitest run packages/spine/src/__tests__/coverage.test.ts

      - name: Rig Ratchet Check
        run: pnpm run check:rig

      - name: Theme Token Ratchet
        run: pnpm run check:theme

      - name: Catalog Validation
        run: pnpm run check:catalog

      - name: Run licence, forbidden source and security gates
        run: pnpm licences && pnpm forbidden && pnpm audit --prod --audit-level=high

  build-and-push-images:
    name: Build & Push Container Images
    needs: ci
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push copper-bff Image
        uses: docker/build-push-action@4f58ea79222b3b150c8844d699730f5f93dcfaca # v5.1.0
        with:
          context: .
          file: Dockerfile.bff
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sindrehaugen/copper-bff:${{ github.sha }}
            ghcr.io/sindrehaugen/copper-bff:latest

      - name: Build and Push copper-web Image
        uses: docker/build-push-action@4f58ea79222b3b150c8844d699730f5f93dcfaca # v5.1.0
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sindrehaugen/copper-web:${{ github.sha }}
            ghcr.io/sindrehaugen/copper-web:latest
